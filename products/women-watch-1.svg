<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.1" />
    </filter>
    <linearGradient id="bezel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="50%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#FCA5A5" />
    </linearGradient>
    <radialGradient id="dial-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF5F5" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53E3E" />
      <stop offset="50%" stop-color="#E53E3E" opacity="0.85" />
      <stop offset="100%" stop-color="#E53E3E" />
    </linearGradient>
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#F8F8F8" rx="16" />

  <g filter="url(#drop-shadow)">
    <!-- Top and Bottom Straps -->
    <rect x="276" y="40" width="48" height="150" rx="8" fill="url(#strap-grad)" />
    <rect x="276" y="395" width="48" height="165" rx="8" fill="url(#strap-grad)" />

    <!-- Crown -->
    <rect x="416" y="288" width="12" height="24" rx="3" fill="url(#bezel-grad)" />

    <!-- Bezel -->
    <circle cx="300" cy="300" r="124" fill="url(#bezel-grad)" />
    <circle cx="300" cy="300" r="112" fill="#111111" opacity="0.15" />

    <!-- Dial -->
    <circle cx="300" cy="300" r="110" fill="url(#dial-grad)" />

    <!-- Markers -->
    <line x1="300" y1="202" x2="300" y2="190" stroke="#9B2C2C" stroke-width="3" stroke-linecap="round" opacity="0.95" />
<line x1="349" y1="215.13" x2="355" y2="204.74" stroke="#9B2C2C" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="384.87" y1="251" x2="395.26" y2="245" stroke="#9B2C2C" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="398" y1="300" x2="410" y2="300" stroke="#9B2C2C" stroke-width="3" stroke-linecap="round" opacity="0.95" />
<line x1="384.87" y1="349" x2="395.26" y2="355" stroke="#9B2C2C" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="349" y1="384.87" x2="355" y2="395.26" stroke="#9B2C2C" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="300" y1="398" x2="300" y2="410" stroke="#9B2C2C" stroke-width="3" stroke-linecap="round" opacity="0.95" />
<line x1="251" y1="384.87" x2="245" y2="395.26" stroke="#9B2C2C" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="215.13" y1="349" x2="204.74" y2="355" stroke="#9B2C2C" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="202" y1="300" x2="190" y2="300" stroke="#9B2C2C" stroke-width="3" stroke-linecap="round" opacity="0.95" />
<line x1="215.13" y1="251" x2="204.74" y2="245" stroke="#9B2C2C" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="251" y1="215.13" x2="245" y2="204.74" stroke="#9B2C2C" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />


    <!-- Sub-dials -->
    

    <!-- Brand -->
    <text x="300" y="270" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#9B2C2C" letter-spacing="3" text-anchor="middle" opacity="0.9">LEGACY WEAR</text>
    <text x="300" y="282" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7" font-weight="400" fill="#9B2C2C" letter-spacing="1.5" text-anchor="middle" opacity="0.6">AUTOMATIC</text>

    <!-- Hands -->
    <line x1="300" y1="300" x2="258" y2="258" stroke="#9B2C2C" stroke-width="3.5" stroke-linecap="round" />
    <line x1="300" y1="300" x2="361" y2="239" stroke="#9B2C2C" stroke-width="2.5" stroke-linecap="round" />
    <line x1="284" y1="316" x2="372" y2="232" stroke="#9B2C2C" stroke-width="1" stroke-linecap="round" />
    <circle cx="300" cy="300" r="5" fill="#9B2C2C" />

    <!-- Glass -->
    <circle cx="300" cy="300" r="110" fill="url(#glass-glare)" />
  </g>
</svg>
