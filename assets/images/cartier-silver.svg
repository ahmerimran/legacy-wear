<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.1" />
    </filter>
    <linearGradient id="bezel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="dial-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#64748B" opacity="0.85" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#F8F8F8" rx="16" />

  <g filter="url(#drop-shadow)">
    <!-- Top and Bottom Straps -->
    <rect x="268" y="40" width="64" height="130" rx="8" fill="url(#strap-grad)" />
    <rect x="268" y="415" width="64" height="145" rx="8" fill="url(#strap-grad)" />

    <!-- Crown -->
    <rect x="436" y="288" width="12" height="24" rx="3" fill="url(#bezel-grad)" />

    <!-- Bezel -->
    <circle cx="300" cy="300" r="144" fill="url(#bezel-grad)" />
    <circle cx="300" cy="300" r="132" fill="#111111" opacity="0.15" />

    <!-- Dial -->
    <circle cx="300" cy="300" r="130" fill="url(#dial-grad)" />

    <!-- Markers -->
    <line x1="300" y1="182" x2="300" y2="170" stroke="#111111" stroke-width="3" stroke-linecap="round" opacity="0.95" />
<line x1="359" y1="197.81" x2="365" y2="187.42" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="402.19" y1="241" x2="412.58" y2="235" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="418" y1="300" x2="430" y2="300" stroke="#111111" stroke-width="3" stroke-linecap="round" opacity="0.95" />
<line x1="402.19" y1="359" x2="412.58" y2="365" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="359" y1="402.19" x2="365" y2="412.58" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="300" y1="418" x2="300" y2="430" stroke="#111111" stroke-width="3" stroke-linecap="round" opacity="0.95" />
<line x1="241" y1="402.19" x2="235" y2="412.58" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="197.81" y1="359" x2="187.42" y2="365" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="182" y1="300" x2="170" y2="300" stroke="#111111" stroke-width="3" stroke-linecap="round" opacity="0.95" />
<line x1="197.81" y1="241" x2="187.42" y2="235" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
<line x1="241" y1="197.81" x2="235" y2="187.42" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />


    <!-- Sub-dials -->
          <circle cx="268" cy="300" r="18" fill="none" stroke="#111111" stroke-opacity="0.3" stroke-width="1.5" />
      <circle cx="332" cy="300" r="18" fill="none" stroke="#111111" stroke-opacity="0.3" stroke-width="1.5" />
      <circle cx="300" cy="336" r="18" fill="none" stroke="#111111" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Brand -->
    <text x="300" y="255" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#111111" letter-spacing="3" text-anchor="middle" opacity="0.9">LEGACY WEAR</text>
    <text x="300" y="268" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7" font-weight="400" fill="#111111" letter-spacing="1.5" text-anchor="middle" opacity="0.6">AUTOMATIC</text>

    <!-- Hands -->
    <line x1="300" y1="300" x2="251" y2="251" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
    <line x1="300" y1="300" x2="372" y2="228" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
    <line x1="280" y1="320" x2="384" y2="219" stroke="#E53E3E" stroke-width="1" stroke-linecap="round" />
    <circle cx="300" cy="300" r="5" fill="#111111" />

    <!-- Glass -->
    <circle cx="300" cy="300" r="130" fill="url(#glass-glare)" />
  </g>
</svg>
